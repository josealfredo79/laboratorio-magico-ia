<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratorio Mágico IA</title>
    <script>
      // Vigilante de arranque. GitHub Pages guarda la página 10 min en el navegador; tras
      // publicar una versión nueva, esa copia vieja apunta a un .js que ya no existe y la app
      // se quedaría cargando para siempre. Si el programa no arranca, se recarga una vez sin
      // caché; si vuelve a fallar, se explica qué hacer en lugar de girar sin fin.
      (function () {
        function fallo(motivo) {
          if (window.__labArranco) return;
          var yaRecargo = false;
          try {
            yaRecargo = sessionStorage.getItem("lab-recarga") === "1";
            sessionStorage.setItem("lab-recarga", "1");
          } catch (e) {}
          if (!yaRecargo) {
            var params = new URLSearchParams(location.search);
            params.set("v", Date.now());
            location.replace(location.pathname + "?" + params + location.hash);
            return;
          }
          var texto = document.getElementById("carga-texto");
          if (texto) texto.innerHTML = "⚠️ No se pudo iniciar (" + motivo + ").<br>Presiona <b>Ctrl + Shift + R</b> para recargar.";
        }
        window.addEventListener("error", function (e) {
          fallo(e.target && e.target.tagName === "SCRIPT" ? "no cargó el programa" : e.message);
        }, true);
        setTimeout(function () { fallo("tardó demasiado en cargar"); }, 20000);
      })();
    </script>
  </head>
  <body>
    <video id="camara" playsinline muted></video>
    <div id="lienzo"></div>
    <div id="ui">
      <div id="carga"><div class="giro"></div><p id="carga-texto">Preparando el laboratorio…</p></div>

      <div id="menu" class="oculto">
        <h1>🧪 Laboratorio Mágico IA</h1>
        <p id="menu-sub" class="sub">✋ Levanta la mano y apunta a una actividad</p>
        <div id="menu-zonas"></div>
        <div id="menu-ranking" class="ranking"></div>
      </div>

      <div id="bienvenida" class="oculto">
        <div>
          <h1>🧪 Laboratorio Mágico IA</h1>
          <p class="sub">La ciencia se juega con las manos</p>
        </div>
        <div class="bienvenida-abajo">
          <p class="llamado">✋ ¡Acércate y levanta la mano para jugar!</p>
          <p class="sub">o mueve el ratón</p>
          <div class="bienvenida-fila">
            <div class="tarjeta dato"><span class="icono">💡</span><div><b>¿Sabías que…?</b><p id="bienvenida-dato"></p></div></div>
            <div id="bienvenida-ranking" class="ranking"></div>
          </div>
        </div>
      </div>

      <button id="volver" class="dwell oculto">⟵ Menú</button>
      <header id="hud" class="oculto">
        <h1 id="hud-titulo"></h1>
        <p id="hud-instruccion"></p>
        <div id="hud-stats"></div>
      </header>

      <div id="aviso" class="oculto"></div>
      <div id="tarjetas" class="oculto"></div>
      <div id="cursores"></div>
      <div id="fps" class="oculto"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
